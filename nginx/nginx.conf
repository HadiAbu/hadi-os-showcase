# Dev-only reverse proxy + rate limiter. Sole host entry point (:8080).
# `api` and `web` only expose their ports inside the compose network, so rate
# limiting here cannot be bypassed. This is NOT the production nginx (no TLS,
# no domain) — see .kiro/steering/tech.md.

worker_processes 1;
events { worker_connections 1024; }

http {
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

  upstream api { server api:8000; }
  upstream web { server web:5173; }

  server {
    listen 8080;

    # backend health, reachable through the proxy for convenience
    location = /api/health {
      proxy_pass http://api/health;
    }

    location /api/auth/ {
      limit_req zone=auth_zone burst=5 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
      limit_req zone=api_zone burst=20 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # chat responses are Server-Sent Events — don't buffer or time them out
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      # Vite HMR websocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
